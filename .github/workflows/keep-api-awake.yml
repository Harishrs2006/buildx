name: Keep API awake

# Render's free plan puts the API to sleep after 15 minutes without requests, and waking it takes about a
# minute (people saw a long spinner on sign-in). A ping every 10 minutes keeps it awake. One always-on service
# uses about 744 of the 750 free instance hours Render gives each month, so this stays free.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 120 --retry 2 --retry-delay 10 https://buildx-api.onrender.com/health -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
